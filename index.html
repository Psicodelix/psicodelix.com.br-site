  <body>
    <div id="root"></div>
    <script>
      (function() {
        function injectProtocols() {
          // Localizar o container de protocolos
          const container = document.querySelector('.grid.md\\\\:grid-cols-2') || document.querySelector('section#protocolos .grid');
          if (!container || document.getElementById('eleve-card')) return;

          // Card ELEVE
          const eleve = document.createElement('div');
          eleve.id = 'eleve-card';
          eleve.className = 'protocol-injected';
          eleve.innerHTML = `
            <img src="/assets-media/eleve_2026.jpg">
            <div class="content">
              <div class="subtitle">Psicoterapia Assistida — 30 dias</div>
              <h3>Protocolo ELEVE</h3>
              <p class="desc">Acompanhamento humano especializado com psicoterapeutas certificados. Ideal para quem prefere consultas online devido à distância e não estar em Belo Horizonte.</p>
              <div class="price-box">
                <div class="price-old">De R$ 837,00</div>
                <div class="price-new">Por R$ 720,00</div>
                <a href="https://loja.psicodelix.com/products/pesquisa-etnobotanica-psicoterapia-assistida-por-psicodelicos-protocolo-30-dias" class="btn">Conhecer o Protocolo</a>
              </div>
            </div>
          `;

          // Card DESS
          const dess = document.createElement('div');
          dess.id = 'dess-card';
          dess.className = 'protocol-injected';
          dess.innerHTML = `
            <img src="/assets-media/dess_2026.jpg">
            <div class="content">
              <div class="subtitle" style="color:#14B8A6">Psicoterapia Intensiva — 60 dias</div>
              <h3 style="color:white">Protocolo DESS</h3>
              <p class="desc">Foco em segurança clínica e desmame assistido de medicações. Protocolo mais indicado para usuários de drogas ou remédios.</p>
              <div class="price-box">
                <div class="price-old">De R$ 1.527,00</div>
                <div class="price-new">Por R$ 1.350,00</div>
                <a href="https://loja.psicodelix.com/products/pesquisa-etnobotanica-psicoterapia-assistida-por-psicodelicos-60-dias" class="btn" style="background:#14B8A6">Conhecer o Protocolo</a>
              </div>
            </div>
          `;

          container.appendChild(eleve);
          container.appendChild(dess);

          // Lógica de Ofertas (3 cards)
          if (window.location.pathname.includes('ofertas')) {
            container.style.gridTemplateColumns = window.innerWidth > 1024 ? 'repeat(3, 1fr)' : '1fr';
            const usesMed = localStorage.getItem('psicodelix_uses_medication') === 'true';
            
            // Se usa remédio: Mostra MED, DESS e NEXUS (Esconde ELEVE)
            // Se NÃO usa: Mostra MED, ELEVE e NEXUS (Esconde DESS)
            if (usesMed) {
              eleve.style.display = 'none';
            } else {
              dess.style.display = 'none';
            }
          }
        }
        setInterval(injectProtocols, 1000);
      })();
    </script>
